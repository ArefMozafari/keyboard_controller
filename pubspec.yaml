name: keyboard_controller
description: >-
  iOS-style interactive keyboard dismiss, a keyboard-stable chat list, a composer that rides the
  keyboard, and AI chat behaviours for Flutter on iOS and Android.
version: 0.1.0
repository: https://github.com/ArefMozafari/keyboard_controller
issue_tracker: https://github.com/ArefMozafari/keyboard_controller/issues
topics:
  - keyboard
  - chat
  - ui
  - widget
  - animation

environment:
  sdk: ^3.7.0
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.arefmozafari.keyboard_controller
        pluginClass: KeyboardControllerPlugin
      ios:
        pluginClass: KeyboardControllerPlugin
