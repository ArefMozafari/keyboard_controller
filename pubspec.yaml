name: keyboard_controller
description: >-
  iOS-style interactive keyboard dismiss, a keyboard-stable chat list, a composer that rides the
  keyboard, and AI chat behaviours for Flutter on iOS and Android.
version: 0.1.1
repository: https://github.com/ArefMozafari/keyboard_controller
issue_tracker: https://github.com/ArefMozafari/keyboard_controller/issues
topics:
  - keyboard
  - chat
  - scroll
  - gestures
  - llm
screenshots:
  - description: >-
      iOS AI chat: the sent prompt stays at the top while the answer streams, then the keyboard
      is swiped away with the input bar riding on it.
    path: media/ios_ai_chat.gif
  - description: >-
      Android messenger: the keyboard follows the finger down with the input bar on top, hides,
      and opens again.
    path: media/android_messenger.gif

environment:
  sdk: ^3.7.0
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.arefmozafari.keyboard_controller
        pluginClass: KeyboardControllerPlugin
      ios:
        pluginClass: KeyboardControllerPlugin
